<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Casino del Azar</title>

  <link rel="stylesheet" href="estilo.css">
  <script src="script.js" defer></script>
</head>

<body>

  <main id="contenedorGeneral">

 <img
      id="tituloPagina"
      src="assets/titulocasino.png"
      alt="Casino"
    >
    <img
      id="flecha"
      src="assets/flechas.png"
      alt="Flecha luminosa apuntando hacia la máquina"
    >
<section id="maquina">

      <img
        id="imagenMaquina"
        src="assets/maquina.png"
        alt="Máquina tragamonedas"
      >

 <div id="pantalla">

        <div class="ventanaRodillo">
          <img
            class="simbolo"
            id="simbolo1"
            src="assets/cerezas.png"
            alt="Cerezas"
          >
        </div>

        <div class="ventanaRodillo">
          <img
            class="simbolo"
            id="simbolo2"
            src="assets/diamante.png"
            alt="Diamante"
          >
        </div>

        <div class="ventanaRodillo">
          <img
            class="simbolo"
            id="simbolo3"
            src="assets/siete.png"
            alt="Siete"
          >
        </div>

      </div>

    </section>

<button id="boton" type="button">
      SPIN
    </button>

  </main>

</body>
</html>
